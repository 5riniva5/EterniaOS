<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EterniaOS - Arcade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-burst"></div>
        <div class="loader-burst loader-burst-alt"></div>
        <div class="loader-burst loader-burst-small"></div>
        <div id="loading-text">ETERNIAOS — BOOTING ARCANA</div>
        <div id="power-sword"></div>
        <div id="slice-top"></div>
        <div id="slice-bottom"></div>
        <div class="loading-grid"></div>
    </div>

    <div class="lunar-container" id="desktop">
        <main class="lunar-main">
            <div id="desktop-grid" class="desktop-grid"></div>
        </main>
    </div>

    <script>
        function dismissLoader() {
            const sword = document.getElementById('power-sword');
            const text = document.getElementById('loading-text');
            const sliceTop = document.getElementById('slice-top');
            const sliceBottom = document.getElementById('slice-bottom');
            const loader = document.getElementById('loading-screen');
            const bursts = document.querySelectorAll('.loader-burst');
            if (sword && text) {
                sword.style.top = '44%';
                sword.style.opacity = '0';
                text.style.transform = 'translateY(-8px) scale(1.02)';
                text.style.opacity = '0';
            }
            bursts.forEach((burst) => burst.classList.add('explode'));
            if (sliceTop) sliceTop.style.transform = 'translateY(-120%)';
            if (sliceBottom) sliceBottom.style.transform = 'translateY(120%)';
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 700);
            }
        }

        function runLoaderSequence() {
            const text = document.getElementById('loading-text');
            const sword = document.getElementById('power-sword');
            const loader = document.getElementById('loading-screen');
            const bursts = document.querySelectorAll('.loader-burst');
            if (!text) return;
            text.textContent = 'BY THE POWER OF GRAYSKULL... THE WEB HAS THE POWER!';
            bursts.forEach((burst, index) => {
                burst.style.animationDelay = `${index * 180}ms`;
                burst.classList.add('pulse');
            });
            setTimeout(() => {
                if (text) {
                    text.textContent = '⚡ LIGHTNING!';
                    text.classList.add('lightning');
                }
                if (sword) {
                    sword.style.top = '48%';
                    sword.classList.add('flash');
                }
                if (loader) loader.classList.add('lightning-flash');
            }, 900);
            setTimeout(dismissLoader, 1800);
        }

        window.addEventListener('DOMContentLoaded', runLoaderSequence);
        const loaderScreen = document.getElementById('loading-screen');
        if (loaderScreen) loaderScreen.addEventListener('click', dismissLoader);
    </script>

    <script src="theme.js"></script>
    <script src="app.js"></script>
    <script src="calculator.js"></script>
    <script src="clock.js"></script>
    <script src="gallery.js"></script>
    <script src="game.js"></script>
    <script src="monitor.js"></script>
    <script src="music.js"></script>
    <script src="notepad.js"></script>
    <script src="tasks.js"></script>
    <script src="terminal.js"></script>

    <div id="taskbar">
        <div id="taskbar-start" onclick="launchApp('settings')">☰ Eternia</div>
        <div id="taskbar-icons"></div>
        <div id="taskbar-clock"></div>
    </div>

    <script>
        if (typeof updateTaskbarClock === 'function') {
            setInterval(updateTaskbarClock, 1000);
            updateTaskbarClock();
        }
    </script>

    <div id="notification-center" aria-live="polite"></div>
</body>
</html>
